  <path stroke="#3B82F6" stroke-width="2" stroke-linecap="round" d="M16 16 L26 11"/>
  <circle cx="26" cy="11" r="1.5" fill="#3B82F6"/>
  <!-- w vector (orange) -->
  <path stroke="#F97316" stroke-width="2" stroke-linecap="round" d="M16 16 L21 24"/>
  <circle cx="21" cy="24" r="1.5" fill="#F97316"/>
