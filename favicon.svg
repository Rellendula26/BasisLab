  <path stroke="#22C55E" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 1.5" d="M16 16 L27 22"/>
  <!-- origin -->
  <circle cx="16" cy="16" r="2" fill="#E5E7EB"/>
