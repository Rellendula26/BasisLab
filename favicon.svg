  <path stroke="#1F2937" stroke-width="0.5" d="M8 0v32M16 0v32M24 0v32M0 8h32M0 16h32M0 24h32"/>
  <!-- axes -->
  <path stroke="#374151" stroke-width="0.75" d="M16 28V4M4 16h24"/>
